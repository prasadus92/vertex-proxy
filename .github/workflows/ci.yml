name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra dev

      - name: Lint
        run: |
          uv run ruff check vertex_proxy tests
          uv run ruff format --check vertex_proxy tests

      - name: Test
        run: uv run pytest -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Audit locked dependencies
        run: |
          uv export --frozen --all-extras --no-emit-project --format requirements.txt -o requirements.txt
          uvx pip-audit==2.10.1 -r requirements.txt --require-hashes --disable-pip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: vertex-proxy:ci

      - name: Smoke test
        run: docker run --rm vertex-proxy:ci --help
