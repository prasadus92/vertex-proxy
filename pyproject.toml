[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "vertex-proxy"
dynamic = ["version"]
description = "Anthropic + Gemini + OpenAI API-compatible proxy for Google Cloud Vertex AI. Bridges static-URL API consumers to Vertex AI's service-account auth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Prasad Subrahmanya", email = "prasad@luminik.io" },
]
keywords = [
    "anthropic",
    "claude",
    "gemini",
    "openai",
    "vertex-ai",
    "google-cloud",
    "gcp",
    "llm",
    "llm-proxy",
    "proxy",
    "api-proxy",
    "openai-compatible",
    "fastapi",
    "service-account",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
    "httptools>=0.9.0",
    "uvloop>=0.23.0; sys_platform != 'win32' and platform_python_implementation == 'CPython'",
    "google-auth[requests]>=2.62.2",
    "httpx2>=2.16.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[project.scripts]
vertex-proxy = "vertex_proxy.__main__:main"

[project.urls]
Homepage = "https://github.com/prasadus92/vertex-proxy"
Author = "https://prasad.tech"
Issues = "https://github.com/prasadus92/vertex-proxy/issues"
Changelog = "https://github.com/prasadus92/vertex-proxy/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "vertex_proxy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["vertex_proxy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
